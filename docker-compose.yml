# Local / VPS stack:
#   docker compose up --build
# Nginx on :80:
#   docker compose --profile prod up --build -d
#
# Secrets: root .env and/or backend/.env (never frontend).
# Neon is external — set DATABASE_URL. Redis is this Compose service.

name: demandaccel

x-backend-env: &backend-env
  REDIS_URL: redis://redis:6379/0
  CELERY_BROKER_URL: redis://redis:6379/0
  CELERY_RESULT_BACKEND: redis://redis:6379/0
  INGESTION_EAGER: "false"

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 8

  backend:
    build:
      context: ./backend
    image: demandaccel-backend:local
    restart: unless-stopped
    command: ["api"]
    env_file:
      - path: .env
        required: false
      - path: backend/.env
        required: false
    environment:
      <<: *backend-env
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,backend}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/api/health/"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 40s

  worker:
    image: demandaccel-backend:local
    build:
      context: ./backend
    restart: unless-stopped
    command: ["worker"]
    env_file:
      - path: .env
        required: false
      - path: backend/.env
        required: false
    environment:
      <<: *backend-env
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy

  beat:
    image: demandaccel-backend:local
    build:
      context: ./backend
    restart: unless-stopped
    command: ["beat"]
    env_file:
      - path: .env
        required: false
      - path: backend/.env
        required: false
    environment:
      <<: *backend-env
      CELERY_BEAT_SCHEDULE_FILENAME: /var/lib/celery/celerybeat-schedule
    volumes:
      - beat-data:/var/lib/celery
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api}
    image: demandaccel-frontend:local
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:3000"

  nginx:
    profiles: ["prod"]
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy

volumes:
  redis-data:
  beat-data:
